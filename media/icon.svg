<?xml version="1.0" encoding="UTF-8"?>
<!--
  Harness 插件图标：多智能体平台
  设计语言：深空底 + 六边形核心（H）+ 三色智能体节点（代码/运维/数据）+ 电路焊点走线
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <defs>
    <!-- 深空背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="0.55" stop-color="#111A38"/>
      <stop offset="1" stop-color="#16204A"/>
    </linearGradient>
    <!-- 核心六边形：青 → 紫 -->
    <linearGradient id="core" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- 中心辉光 -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.75" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- 科技网格 -->
  <g stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1">
    <path d="M24 8 V120 M40 8 V120 M56 8 V120 M72 8 V120 M88 8 V120 M104 8 V120"/>
    <path d="M8 24 H120 M8 40 H120 M8 56 H120 M8 72 H120 M8 88 H120 M8 104 H120"/>
  </g>

  <!-- 中心辉光 + 虚线环 -->
  <circle cx="64" cy="62" r="46" fill="url(#glow)"/>
  <circle cx="64" cy="62" r="37" fill="none" stroke="#A5F3FC" stroke-opacity="0.28"
          stroke-width="1" stroke-dasharray="3 5"/>

  <!-- 电路走线：核心 → 三智能体节点 -->
  <g stroke-width="2" stroke-linecap="round">
    <path d="M64 38 V18" stroke="#22D3EE"/>
    <path d="M84.8 74 L98 79" stroke="#34D399"/>
    <path d="M43.2 74 L30 79" stroke="#FBBF24"/>
  </g>
  <!-- 电路焊点（空心圆） -->
  <g fill="#0B1226" stroke-width="1.6">
    <circle cx="64" cy="28" r="2.6" stroke="#22D3EE"/>
    <circle cx="91.4" cy="76.5" r="2.6" stroke="#34D399"/>
    <circle cx="36.6" cy="76.5" r="2.6" stroke="#FBBF24"/>
  </g>
  <!-- 四角焊点装饰 -->
  <g fill="#7DD3FC" fill-opacity="0.4">
    <circle cx="16" cy="16" r="1.6"/>
    <circle cx="112" cy="16" r="1.6"/>
    <circle cx="16" cy="112" r="1.6"/>
    <circle cx="112" cy="112" r="1.6"/>
  </g>

  <!-- 核心六边形（点尖朝上，中心 64,62，外接圆半径 24） -->
  <polygon points="64,38 84.8,50 84.8,74 64,86 43.2,74 43.2,50"
           fill="url(#core)" stroke="#E0F2FE" stroke-opacity="0.9" stroke-width="1.5"/>
  <!-- 六边形外圈光晕 -->
  <polygon points="64,38 84.8,50 84.8,74 64,86 43.2,74 43.2,50"
           fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="6"
           stroke-linejoin="round"/>

  <!-- 核心字母 H -->
  <text x="64" y="71.5" text-anchor="middle"
        font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold"
        fill="#FFFFFF">H</text>

  <!-- 三智能体节点（带光晕）：代码 / 运维 / 数据 -->
  <g>
    <circle cx="64" cy="18" r="10.5" fill="#22D3EE" fill-opacity="0.22"/>
    <circle cx="64" cy="18" r="5.5" fill="#22D3EE" stroke="#E0F2FE" stroke-width="1.2"/>

    <circle cx="98" cy="79" r="10.5" fill="#34D399" fill-opacity="0.22"/>
    <circle cx="98" cy="79" r="5.5" fill="#34D399" stroke="#E0F2FE" stroke-width="1.2"/>

    <circle cx="30" cy="79" r="10.5" fill="#FBBF24" fill-opacity="0.22"/>
    <circle cx="30" cy="79" r="5.5" fill="#FBBF24" stroke="#E0F2FE" stroke-width="1.2"/>
  </g>
</svg>
